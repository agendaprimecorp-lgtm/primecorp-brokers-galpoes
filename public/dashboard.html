<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrimeCorp - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }

    .login-card {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #C8102E;
      margin-bottom: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #C8102E;
      box-shadow: 0 0 0 2px rgba(200,16,46,0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      background: #C8102E;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover { background: #a00824; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .error { color: #d32f2f; font-size: 12px; margin-top: 5px; }
    .success { color: #388e3c; font-size: 12px; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">🏢 PRIMECORP</div>
        <p style="color: #666; font-size: 14px;">Brokers · Consultoria</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="user">Usuário</label>
          <input type="text" id="user" name="user" value="rodrigo" required>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" value="PrimeCorp@2024" required>
        </div>

        <button type="submit" id="loginBtn">Entrar</button>
        <div id="message"></div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const user = document.getElementById('user').value;
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('message');
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      messageEl.innerHTML = '';

      try {
        const response = await fetch('/.netlify/functions/login', {
          method: 'POST',
          body: JSON.stringify({ user, password })
        });

        const data = await response.json();

        if (response.ok && data.token) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', data.user);
          window.location.href = '/app.html';
        } else {
          messageEl.className = 'error';
          messageEl.textContent = data.message || 'Erro ao fazer login';
        }
      } catch (error) {
        messageEl.className = 'error';
        messageEl.textContent = 'Erro de conexão';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
