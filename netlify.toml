[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["imapflow", "mailparser"]

# App também em /app (no domínio propto.com.br a raiz é a página comercial).
[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

# Domínio da marca Propto (opcional): a raiz mostra a página da Propto; /i/<token> continua servindo os anúncios.
[[redirects]]
  from = "https://propto.com.br/"
  to = "/propto.html"
  status = 200
  force = true

[[redirects]]
  from = "https://www.propto.com.br/"
  to = "/propto.html"
  status = 200
  force = true
